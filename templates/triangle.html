<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area of Triangle</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/profile">Profile</a></li>
            <li><a href="/works">Works</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Area of Triangle Calculator</h1>
            <p>Formula: A = (base × height) / 2</p>

            <form action="/works/area/triangle" method="post">
                <div class="form-group">
                    <label for="base">Enter base (in units):</label>
                    <input type="text" id="base" name="base" placeholder="e.g., 10" required>
                </div>
                <div class="form-group">
                    <label for="height">Enter height (in units):</label>
                    <input type="text" id="height" name="height" placeholder="e.g., 8" required>
                </div>
                <input type="submit" value="Calculate">
            </form>

            {% if error %}
            <div class="error">
                ❌ {{ error }}
            </div>
            {% endif %}

            {% if result %}
            <div class="result">
                <strong>Area of the triangle:</strong><br>
                {{ result }} square units
            </div>
            {% endif %}
        </div>
    </div>
</body>
</html>
